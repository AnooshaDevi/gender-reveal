<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .reveal-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
            width: 100%;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .reveal-btn:active {
            transform: scale(0.98);
            background-color: #357abd;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4);
        }

        .result {
            font-size: 2rem;
            font-weight: 800;
            color: #0076ff; /* Blue text */
            margin-top: 25px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none;
        }

        .result.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <button id="revealBtn" class="reveal-btn">Reveal the Gender</button>
        <div id="resultText" class="result">It is a boy!</div>
    </div>

    <script>
        document.getElementById('revealBtn').addEventListener('click', function() {
            const result = document.getElementById('resultText');
            
            // Show the text element
            result.classList.add('show');
            
            // Optional: Hide or disable the button after click
            this.style.display = 'none';
        });
    </script>

</body>
</html>
